# Stack Evolution API + Postgres para WhatsApp (Baileys)
# Uso: docker compose -f docker-compose.evolution.yml up -d

services:
  evo-postgres:
    image: postgres:16-alpine
    container_name: evo-postgres
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution123
      POSTGRES_DB: evolution
    ports:
      - "5433:5432"
    volumes:
      - evo_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: evolution-api
    depends_on:
      - evo-postgres
    ports:
      - "8080:8080"
    environment:
      SERVER_URL: http://localhost:8080
      SERVER_PORT: "8080"
      AUTHENTICATION_API_KEY: devops-pulse-evolution-key-2026
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:evolution123@evo-postgres:5432/evolution?schema=public
      DATABASE_URL: postgresql://evolution:evolution123@evo-postgres:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: evolution_pulse
      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"
      LOG_LEVEL: ERROR,WARN,INFO
      TZ: America/Sao_Paulo
    restart: unless-stopped

volumes:
  evo_pgdata:
