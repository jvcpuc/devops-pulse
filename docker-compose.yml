services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      APP_HOST: 0.0.0.0
      # No Docker, Ollama/Kokoro/n8n no host usam host.docker.internal (Windows/macOS)
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      KOKORO_BASE_URL: ${KOKORO_BASE_URL:-http://host.docker.internal:8880}
      N8N_BASE_URL: ${N8N_BASE_URL:-http://host.docker.internal:5678}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:latest
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=false
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - APP_BASE_URL=http://host.docker.internal:8000
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n:/workflows
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    profiles:
      - full

  # Ollama no host é preferido no Windows (GPU). Este serviço é opcional.
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    profiles:
      - full

volumes:
  n8n_data:
  ollama_data:
